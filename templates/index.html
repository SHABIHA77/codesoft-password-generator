<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Password Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="background">


    <!-- HEADER -->

    <header>

        <div class="lock-icon">🔐</div>

        <h1>PASSWORD GENERATOR</h1>

        <p>CREATE STRONG & SECURE PASSWORDS</p>

    </header>


    <!-- ================================
         FRONT PAGE
    ================================= -->

    <section class="mode-selection" id="modeSelection">

        <h2>WHAT DO YOU WANT TO DO?</h2>

        <p>Choose an option to continue</p>


        <button onclick="showGenerator()">
            🎲 GENERATE A SECURE PASSWORD
        </button>


        <button onclick="showCustomPassword()">
            ✍️ CREATE YOUR OWN PASSWORD
        </button>

    </section>


    <!-- ================================
         GENERATE PASSWORD
    ================================= -->

    <main
        class="generator-card"
        id="generatorSection"
        style="display: none;"
    >

        <!-- LEFT SIDE -->

        <section class="left-section">

            <h2>PASSWORD LENGTH</h2>


            <div class="length-box">

                <input
                    type="number"
                    id="length"
                    value="16"
                    min="4"
                    max="100"
                >


                <input
                    type="range"
                    id="lengthRange"
                    value="16"
                    min="4"
                    max="100"
                >

            </div>


            <div class="include-title">
                INCLUDE CHARACTERS
            </div>


            <label class="option">

                <input
                    type="checkbox"
                    id="uppercase"
                    checked
                >

                <span>UPPERCASE LETTERS (A-Z)</span>

                <b>A</b>

            </label>


            <label class="option">

                <input
                    type="checkbox"
                    id="lowercase"
                    checked
                >

                <span>LOWERCASE LETTERS (a-z)</span>

                <b>a</b>

            </label>


            <label class="option">

                <input
                    type="checkbox"
                    id="numbers"
                    checked
                >

                <span>NUMBERS (0-9)</span>

                <b>9</b>

            </label>


            <label class="option">

                <input
                    type="checkbox"
                    id="symbols"
                    checked
                >

                <span>SPECIAL CHARACTERS (!@#$%&*)</span>

                <b>*</b>

            </label>

        </section>


        <!-- RIGHT SIDE -->

        <section class="right-section">

            <h2>GENERATED PASSWORD</h2>


            <div class="password-box">

                <input
                    type="text"
                    id="password"
                    placeholder="Your password"
                    readonly
                >


                <button
                    type="button"
                    onclick="copyPassword()"
                    title="Copy Password"
                >
                    📋
                </button>

            </div>


            <div class="strength-heading">

                <span>PASSWORD STRENGTH</span>

                <strong id="strength">STRONG</strong>

            </div>


            <div class="strength-bar">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <button
                type="button"
                class="generate-btn"
                onclick="generatePassword()"
            >
                🔐 GENERATE PASSWORD
            </button>


            <div class="buttons">

                <button
                    type="button"
                    onclick="copyPassword()"
                >
                    📋 COPY PASSWORD
                </button>


                <button
                    type="button"
                    onclick="clearPassword()"
                >
                    🗑 CLEAR ALL
                </button>

            </div>


            <p id="message"></p>


            <button
                type="button"
                onclick="goBack()"
            >
                ← BACK
            </button>

        </section>

    </main>


    <!-- ================================
         CREATE YOUR OWN PASSWORD
    ================================= -->

    <main
        class="generator-card"
        id="customSection"
        style="display: none;"
    >

        <section class="right-section">

            <h2>CREATE YOUR OWN PASSWORD</h2>


            <div class="password-box">

                <input
                    type="text"
                    id="customPassword"
                    placeholder="Type your password here"
                    oninput="checkCustomPassword()"
                >


                <button
                    type="button"
                    onclick="copyCustomPassword()"
                    title="Copy Password"
                >
                    📋
                </button>

            </div>


            <div class="strength-heading">

                <span>PASSWORD STRENGTH</span>

                <strong id="customStrength">
                    ENTER PASSWORD
                </strong>

            </div>


            <div class="strength-bar">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <div class="buttons">

                <button
                    type="button"
                    onclick="copyCustomPassword()"
                >
                    📋 COPY PASSWORD
                </button>


                <button
                    type="button"
                    onclick="clearCustomPassword()"
                >
                    🗑 CLEAR ALL
                </button>

            </div>


            <p id="customMessage"></p>


            <button
                type="button"
                onclick="goBack()"
            >
                ← BACK
            </button>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        🔒 &nbsp;
        STAY SECURE. STAY PROTECTED.
        &nbsp; 🔒

    </footer>


</div>


<script>


/* =================================
   LENGTH SLIDER
================================= */

const lengthInput =
    document.getElementById("length");

const lengthRange =
    document.getElementById("lengthRange");


lengthInput.addEventListener("input", function () {

    lengthRange.value = lengthInput.value;

});


lengthRange.addEventListener("input", function () {

    lengthInput.value = lengthRange.value;

});


/* =================================
   FRONT PAGE
================================= */

function showGenerator() {

    document.getElementById("modeSelection").style.display =
        "none";

    document.getElementById("customSection").style.display =
        "none";

    document.getElementById("generatorSection").style.display =
        "grid";

}


function showCustomPassword() {

    document.getElementById("modeSelection").style.display =
        "none";

    document.getElementById("generatorSection").style.display =
        "none";

    document.getElementById("customSection").style.display =
        "grid";

}


function goBack() {

    document.getElementById("generatorSection").style.display =
        "none";

    document.getElementById("customSection").style.display =
        "none";

    document.getElementById("modeSelection").style.display =
        "block";

}


/* =================================
   GENERATE PASSWORD
================================= */

async function generatePassword() {

    const length =
        Number(document.getElementById("length").value);

    const uppercase =
        document.getElementById("uppercase").checked;

    const lowercase =
        document.getElementById("lowercase").checked;

    const numbers =
        document.getElementById("numbers").checked;

    const symbols =
        document.getElementById("symbols").checked;


    try {

        const response = await fetch("/generate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                length: length,
                uppercase: uppercase,
                lowercase: lowercase,
                numbers: numbers,
                symbols: symbols

            })

        });


        const data = await response.json();


        if (data.password) {

            document.getElementById("password").value =
                data.password;

            updateStrength(length);

            document.getElementById("message").innerText =
                "Password generated successfully.";

        }

        else {

            document.getElementById("message").innerText =
                data.error || "Unable to generate password.";

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "Something went wrong.";

    }

}


/* =================================
   PASSWORD STRENGTH
================================= */

function updateStrength(length) {

    const bars =
        document.querySelectorAll(
            "#generatorSection .strength-bar span"
        );

    const strength =
        document.getElementById("strength");


    bars.forEach(function (bar) {

        bar.classList.remove("active");

    });


    if (length < 8) {

        bars[0].classList.add("active");

        strength.innerText = "WEAK";

    }

    else if (length < 12) {

        bars[0].classList.add("active");
        bars[1].classList.add("active");

        strength.innerText = "MEDIUM";

    }

    else if (length < 16) {

        bars[0].classList.add("active");
        bars[1].classList.add("active");
        bars[2].classList.add("active");

        strength.innerText = "GOOD";

    }

    else {

        bars.forEach(function (bar) {

            bar.classList.add("active");

        });

        strength.innerText = "STRONG";

    }

}


/* =================================
   COPY SOUND
================================= */

function playCopySound() {

    const sound = new Audio(
        "{{ url_for('static', filename='copy-sound.mp3') }}"
    );

    sound.volume = 0.6;

    sound.currentTime = 0;

    sound.play().catch(function (error) {

        console.log(
            "Copy sound could not play:",
            error
        );

    });

}


/* =================================
   COPY GENERATED PASSWORD
================================= */

function copyPassword() {

    const password =
        document.getElementById("password").value;


    if (password === "") {

        document.getElementById("message").innerText =
            "Generate a password first.";

        return;

    }


    navigator.clipboard.writeText(password)
        .then(function () {

            playCopySound();

            document.getElementById("message").innerText =
                "Password copied successfully.";

        })
        .catch(function () {

            document.getElementById("message").innerText =
                "Unable to copy password.";

        });

}


/* =================================
   CUSTOM PASSWORD STRENGTH
================================= */

function checkCustomPassword() {

    const password =
        document.getElementById("customPassword").value;

    const strength =
        document.getElementById("customStrength");

    const bars =
        document.querySelectorAll(
            "#customSection .strength-bar span"
        );


    bars.forEach(function (bar) {

        bar.classList.remove("active");

    });


    if (password.length === 0) {

        strength.innerText = "ENTER PASSWORD";

        return;

    }


    let score = 0;


    if (password.length >= 8) {
        score++;
    }

    if (/[A-Z]/.test(password)) {
        score++;
    }

    if (/[a-z]/.test(password)) {
        score++;
    }

    if (/[0-9]/.test(password)) {
        score++;
    }

    if (/[^A-Za-z0-9]/.test(password)) {
        score++;
    }


    for (let i = 0; i < score; i++) {

        bars[i].classList.add("active");

    }


    if (score <= 2) {

        strength.innerText = "WEAK";

    }

    else if (score === 3) {

        strength.innerText = "MEDIUM";

    }

    else if (score === 4) {

        strength.innerText = "GOOD";

    }

    else {

        strength.innerText = "STRONG";

    }

}


/* =================================
   COPY CUSTOM PASSWORD
================================= */

function copyCustomPassword() {

    const password =
        document.getElementById("customPassword").value;


    if (password === "") {

        document.getElementById("customMessage").innerText =
            "Enter a password first.";

        return;

    }


    navigator.clipboard.writeText(password)
        .then(function () {

            playCopySound();

            document.getElementById("customMessage").innerText =
                "Password copied successfully.";

        })
        .catch(function () {

            document.getElementById("customMessage").innerText =
                "Unable to copy password.";

        });

}


/* =================================
   CLEAR GENERATED PASSWORD
================================= */

function clearPassword() {

    document.getElementById("password").value = "";

    document.getElementById("message").innerText = "";

    document.getElementById("strength").innerText =
        "STRONG";


    document.querySelectorAll(
        "#generatorSection .strength-bar span"
    ).forEach(function (bar) {

        bar.classList.remove("active");

    });

}


/* =================================
   CLEAR CUSTOM PASSWORD
================================= */

function clearCustomPassword() {

    document.getElementById("customPassword").value = "";

    document.getElementById("customMessage").innerText = "";

    document.getElementById("customStrength").innerText =
        "ENTER PASSWORD";


    document.querySelectorAll(
        "#customSection .strength-bar span"
    ).forEach(function (bar) {

        bar.classList.remove("active");

    });

}

</script>


</body>

</html>
